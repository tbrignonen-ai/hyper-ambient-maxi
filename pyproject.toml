[project]
name = "hyper-ambient-maxi"
version = "0.4.0"
description = "Local voice harness with reliable long-term memory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Hyper Ambient Maxi contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
voice = ["faster-whisper", "piper-tts", "sounddevice", "numpy"]
hotkey = ["pynput"]

[project.scripts]
hyper-ambient-maxi = "hyper_ambient_maxi.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
